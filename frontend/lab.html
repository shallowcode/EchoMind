<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>supportFlow · 能力工作台</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/assets/style.css?v=20260923-showcase"><link rel="stylesheet" href="/assets/lab.css?v=1"><script src="/assets/execution.js?v=20260923-showcase" defer></script><script src="/assets/lab.js?v=3" defer></script></head>
<body class="lab-body"><header class="lab-header"><a class="brand" href="/"><img src="/assets/logo.svg" width="32" height="32" alt=""><span>supportFlow.</span></a><span>能力工作台</span><nav><a href="/">客服对话</a><a href="/admin">商户后台 ↗</a></nav></header>
<main class="lab-main"><div class="lab-heading"><div><span class="eyebrow">SANDBOX / OBSERVABILITY</span><h1>看见每一步执行</h1></div><button id="reload-page">刷新数据</button></div>
<nav class="lab-tabs" aria-label="能力展示"><button data-view="tasks" class="selected">复合任务</button><button data-view="knowledge">知识与 Skills</button><button data-view="business">工具与工单</button><button data-view="evaluation">意图评测</button></nav>
<p id="lab-status" role="status" hidden></p>
<section id="tasks" class="lab-view"><div class="lab-card"><div class="card-title"><h2>复合诉求演示</h2><div><button id="new-demo">新演示会话</button> <button id="seed-demo">创建演示订单</button></div></div><p class="muted">使用独立会话。退款申请进入沙箱审核队列。</p><form id="run-task"><textarea id="task-message" aria-label="复合诉求" required>登录报错401，同时查询全部订单，并说明退款审核条件。</textarea><div class="form-actions"><button class="primary" id="run-button">运行</button></div></form></div><div id="task-result"></div></section>
<section id="knowledge" class="lab-view" hidden><div class="lab-columns"><div class="lab-card"><div class="card-title"><h2>业务 Skills</h2><button id="reload-skills">从磁盘热重载</button></div><div id="skills-list"></div></div><div class="lab-card"><h2>共享知识库</h2><p id="kb-backend" class="muted"></p><div id="knowledge-list"></div></div></div></section>
<section id="business" class="lab-view" hidden><div class="lab-columns"><div class="lab-card"><div class="card-title"><h2>MCP 工具服务</h2><button id="probe-mcp">连接并查询订单</button></div><p class="muted" id="transport"></p><div id="mcp-result"></div><div id="tool-controls"></div></div><div class="lab-card"><h2>人工工单</h2><div id="ticket-list"></div></div></div><div class="lab-card"><h2>业务审计</h2><div id="audit-list"></div></div></section>
<section id="evaluation" class="lab-view" hidden><div id="eval-loading" class="lab-card">加载归档…</div><div id="eval-content" hidden><div class="eval-title"><h2 id="eval-model"></h2><span id="eval-date" class="tag"></span></div><div class="lab-metrics" id="eval-metrics"></div><div class="lab-card"><h2>评测口径</h2><div id="eval-notes"></div><details><summary>数据来源与校验</summary><pre id="eval-source"></pre></details></div><div class="lab-card"><div class="card-title"><h2>混淆矩阵</h2><span class="muted">行：真实标签 · 列：预测标签 · 点击数字查看样本</span></div><div class="matrix-scroll" id="confusion"></div></div><div class="lab-columns"><div class="lab-card"><h2>标签映射</h2><div class="table-wrap" id="mapping"></div></div><div class="lab-card"><h2>各类 F1</h2><div id="f1"></div></div></div><div class="lab-card"><div class="card-title"><h2>样本明细</h2><button id="clear-filter">清除筛选</button></div><div class="sample-filters"><input id="sample-query" aria-label="搜索评测样本" placeholder="搜索样本或标签"><label><input id="errors-only" type="checkbox" checked>仅误判</label><span id="sample-count"></span></div><div id="samples"></div><button id="more-samples">加载更多</button></div></div></section>
</main></body></html>
