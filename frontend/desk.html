<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>supportFlow · 客服工作台</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/assets/desk.css"><script src="/assets/session.js" defer></script><script src="/assets/desk.js" defer></script></head>
<body class="desk-page"><header class="desk-header"><a class="desk-brand" href="/"><img src="/assets/logo.svg" width="30" height="30" alt="">supportFlow<span>客服工作台</span></a><nav><a href="/">客户对话</a><a href="/admin">订单与退款</a><a href="/lab">能力工作台</a><button id="logout">账号</button></nav></header>
<div id="feedback" class="desk-feedback" role="status" hidden></div>
<section class="desk-metrics" aria-label="业务概况"><article><span>会话</span><strong id="stat-conversations">—</strong></article><article><span>待接入</span><strong id="stat-waiting">—</strong></article><article><span>人工服务中</span><strong id="stat-human">—</strong></article><article><span>待处理工单</span><strong id="stat-tickets">—</strong></article><div class="desk-tabs"><button id="view-inbox" class="selected">接待</button><button id="view-users" hidden>成员</button><button id="view-audit">操作记录</button><span id="live">连接中</span></div></section>
<main id="inbox" class="desk-layout"><aside class="desk-queue"><div class="queue-heading"><h1>会话</h1><select id="mode-filter" aria-label="会话状态"><option value="">全部</option><option value="waiting">待接入</option><option value="human">人工服务</option><option value="ai">AI 服务</option></select></div><div id="conversation-list"></div></aside>
<section class="desk-chat"><header><div><h2 id="conversation-title">选择会话</h2><small id="conversation-meta"></small></div><div class="desk-actions"><button id="takeover" class="primary" disabled>接入会话</button><button id="resume" disabled>恢复 AI</button></div></header><div id="transcript" class="desk-transcript" role="log" aria-live="polite"><div class="desk-empty">待接入的会话会显示在这里</div></div><form id="reply-form"><textarea id="reply" placeholder="回复客户…" maxlength="6000" rows="3" aria-label="客服回复" disabled></textarea><button id="send-reply" class="primary" disabled>发送</button></form></section>
<aside class="desk-context"><h2>关联工单</h2><div id="ticket-list"><p class="desk-muted">选择会话后查看</p></div></aside></main>
<section id="users-panel" class="desk-panel" hidden><div class="panel-heading"><h1>成员</h1><button id="new-user" class="primary">添加成员</button></div><div id="user-list"></div></section>
<section id="audit-panel" class="desk-panel" hidden><div class="panel-heading"><h1>操作记录</h1><button id="refresh-audit">刷新</button></div><div id="audit-list"></div></section>
<dialog id="user-dialog"><form id="user-form"><h2>添加成员</h2><label>姓名<input id="user-name" required maxlength="80"></label><label>账号<input id="user-id" required pattern="[A-Za-z0-9_-]{1,80}" autocomplete="off"></label><label>密码<input id="user-password" type="password" required minlength="10" maxlength="72" autocomplete="new-password"></label><label>角色<select id="user-role"><option value="staff">客服</option><option value="finance">财务</option><option value="customer">客户</option><option value="ops">运维</option><option value="admin">管理员</option></select></label><p id="user-error" role="alert"></p><div class="desk-actions"><button id="cancel-user" type="button">取消</button><button class="primary">创建</button></div></form></dialog>
</body></html>
