<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>supportFlow · 商户后台</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/admin.css"><script src="/assets/session.js?v=3" defer></script><script src="/assets/admin.js?v=20260928-product" defer></script></head>
<body class="merchant-body">
  <header class="merchant-header"><a class="brand" href="/admin"><img src="/assets/logo.svg" alt="" width="32" height="32"><span>supportFlow<span class="brand-dot">.</span></span></a><span class="merchant-label">商户后台</span><div class="header-actions"><span class="environment" id="environment">连接中</span><a class="back-chat" href="/desk">客服工作台 ↗</a><a class="back-chat" href="/lab">能力工作台 ↗</a><a class="back-chat" href="/">客服页面 ↗</a><button id="account-button" class="merchant-account">连接账户</button></div></header>
  <main class="merchant-main">
    <section class="merchant-intro"><div><h1>商户工作台</h1></div><button class="secondary" id="refresh">↻ 刷新</button></section>
    <div class="metric-grid"><article><span>订单总数</span><strong id="metric-orders">—</strong></article><article><span>待审核退款</span><strong id="metric-pending">—</strong></article><article><span>已退款金额</span><strong id="metric-refunded">—</strong></article><article><span>净收款</span><strong id="metric-net">—</strong></article></div>
    <section class="merchant-panel">
      <div class="panel-head"><nav class="merchant-tabs" aria-label="商户业务"><button id="tab-orders" class="selected">订单管理</button><button id="tab-refunds">退款审批</button></nav><button class="primary" id="new-order" disabled>＋ 新增订单</button></div>
      <form class="merchant-filters" id="filters"><input id="search" placeholder="搜索订单号、客户或商品" aria-label="搜索"><select id="status-filter" aria-label="状态筛选"></select><button class="secondary" type="submit">查询</button></form>
      <div id="feedback" class="merchant-feedback" role="status" hidden></div>
      <div class="table-scroll"><table id="data-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table><div class="table-empty" id="table-empty"><img src="/assets/logo.svg" alt="" width="40" height="40"><p>连接商户账户后查看</p><button class="primary" id="empty-login">连接账户</button></div></div>
      <footer class="table-footer"><span id="row-count">—</span><div><button class="secondary" id="previous" disabled>上一页</button><span id="page-number">1</span><button class="secondary" id="next" disabled>下一页</button></div></footer>
    </section>
  </main>
  <dialog id="auth-dialog"><form id="auth-form"><div class="dialog-header"><h2>连接商户账户</h2><button class="icon-button" id="close-auth" type="button" aria-label="关闭登录">×</button></div><label for="admin-token">访问令牌</label><input id="admin-token" type="password" placeholder="粘贴管理员或财务令牌" autocomplete="off"><p class="login-error" id="auth-error" role="alert"></p><button class="primary login-submit" type="submit">连接</button><div class="or">或</div><label class="import-button" for="admin-file">导入演示凭证</label><input id="admin-file" class="file-input" type="file" accept=".json,application/json"><button id="admin-logout" class="logout" type="button" hidden>退出登录</button></form></dialog>
  <dialog id="order-dialog" aria-labelledby="order-dialog-title"><form id="create-order"><div class="dialog-header"><h2 id="order-dialog-title">新增订单</h2><button class="icon-button" id="close-order" type="button" aria-label="关闭新增订单">×</button></div><div class="order-form-grid"><label class="wide">订单号<input id="create-id" required pattern="[A-Za-z0-9_-]{4,32}" maxlength="32"></label><label class="wide" id="customer-field" hidden>客户账号<input id="create-customer" value="alice" pattern="[A-Za-z0-9_-]{1,80}" maxlength="80"></label><label class="wide">商品名称<input id="create-product" placeholder="例如：纯棉家居套装" required maxlength="120"></label><label>数量<input id="create-quantity" type="number" min="1" max="10000" step="1" value="1" required></label><label>订单总额（元）<input id="create-total" type="number" min="0.01" max="1000000" step="0.01" placeholder="0.00" required></label><label>订单状态<select id="create-status"><option value="paid">已支付</option><option value="pending_payment">待支付</option><option value="shipped">已发货</option><option value="completed">已完成</option></select></label></div><p id="create-error" class="login-error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-order" class="secondary">取消</button><button class="primary" id="save-order" type="submit">创建订单</button></div></form></dialog>
</body></html>
